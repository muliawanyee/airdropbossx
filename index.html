<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>BossX - Cyber Node Mining</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100%;
  }
  
  /* ============ PHONE FRAME ============ */
  .phone-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background: #000;
  }
  .phone-frame {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 900px;
    background: #000;
    border-radius: 40px;
    border: 2px solid rgba(255,215,0,0.1);
    box-shadow: 0 0 80px rgba(255,215,0,0.15), inset 0 0 80px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 25px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }
  
  /* ============ BACKGROUND GRID ============ */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,215,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,215,0,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
  }
  
  /* ============ MATRIX PARTICLES ============ */
  .matrix-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .matrix-char {
    position: absolute;
    top: -20px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: rgba(0,255,136,0.4);
    animation: matrixFall linear infinite;
    text-shadow: 0 0 5px rgba(0,255,136,0.8);
  }
  @keyframes matrixFall {
    0% { transform: translateY(-20px); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }
  
  /* ============ STATUS BAR ============ */
  .status-bar {
    padding: 8px 20px 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    background: rgba(0,0,0,0.8);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }
  
  /* ============ APP HEADER ============ */
  .app-header {
    padding: 15px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.8);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }
  .logo-mobile {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd700, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  
  /* ============ MAIN CONTENT ============ */
  .main-content {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  /* ============ BALANCE CARD ============ */
  .balance-card {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    background: rgba(10,10,15,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 20px;
    padding: 20px;
    z-index: 20;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .balance-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .balance-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
    animation: blink 2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .balance-amount {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 30px rgba(255,215,0,0.3);
    margin-bottom: 10px;
  }
  .balance-stats {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid rgba(255,215,0,0.1);
  }
  .balance-stat {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .balance-stat-label {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
  }
  .balance-stat-value {
    font-size: 14px;
    font-weight: bold;
    color: #00ff88;
  }
  
  /* ============ CYBER NODE (CENTER) ============ */
  .node-container {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* Orbital Rings */
  .orbital-ring {
    position: absolute;
    border: 2px solid transparent;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .orbital-ring.active {
    opacity: 1;
  }
  
  .ring-1 {
    width: 280px;
    height: 280px;
    border-top-color: #ffd700;
    border-right-color: rgba(255,215,0,0.3);
    animation: rotate1 3s linear infinite;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
  }
  .ring-2 {
    width: 240px;
    height: 240px;
    border-bottom-color: #00ff88;
    border-left-color: rgba(0,255,136,0.3);
    animation: rotate2 2s linear infinite;
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
  }
  .ring-3 {
    width: 200px;
    height: 200px;
    border-top-color: #ff8c00;
    border-left-color: rgba(255,140,0,0.3);
    animation: rotate3 4s linear infinite;
    box-shadow: 0 0 20px rgba(255,140,0,0.3);
  }
  
  @keyframes rotate1 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes rotate2 {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-360deg); }
  }
  @keyframes rotate3 {
    0% { transform: rotate(0deg) rotateX(60deg); }
    100% { transform: rotate(360deg) rotateX(60deg); }
  }
  
  /* Core Node */
  .core-node {
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00, #cc6600);
    box-shadow: 
      0 0 60px rgba(255,215,0,0.6),
      0 0 100px rgba(255,215,0,0.3),
      inset 0 0 30px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.3;
    transition: all 0.5s;
  }
  .core-node.active {
    opacity: 1;
    animation: corePulse 2s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { 
      transform: scale(1);
      box-shadow: 
        0 0 60px rgba(255,215,0,0.6),
        0 0 100px rgba(255,215,0,0.3),
        inset 0 0 30px rgba(255,255,255,0.3);
    }
    50% { 
      transform: scale(1.05);
      box-shadow: 
        0 0 80px rgba(255,215,0,0.8),
        0 0 150px rgba(255,215,0,0.5),
        inset 0 0 40px rgba(255,255,255,0.5);
    }
  }
  
  /* Core Inner Symbol */
  .core-symbol {
    font-size: 40px;
    color: #000;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  
  /* Data Streams */
  .data-stream {
    position: absolute;
    width: 2px;
    height: 0;
    background: linear-gradient(180deg, transparent, #00ff88, transparent);
    opacity: 0;
    transition: all 0.5s;
  }
  .data-stream.active {
    opacity: 1;
    animation: streamFlow 2s linear infinite;
  }
  @keyframes streamFlow {
    0% { height: 0; top: 50%; }
    50% { height: 100px; top: 0; }
    100% { height: 0; top: -50px; }
  }
  
  /* ============ POWER BUTTON ============ */
  .power-section {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 20;
  }
  .power-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(10,10,15,0.8);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(0,255,136,0.3);
    color: #00ff88;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    box-shadow: 0 0 30px rgba(0,255,136,0.2);
  }
  .power-btn::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1px solid rgba(0,255,136,0.2);
    animation: ripple 2s infinite;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .power-btn.active {
    background: rgba(255,215,0,0.2);
    border-color: #ffd700;
    color: #ffd700;
    box-shadow: 0 0 50px rgba(255,215,0,0.5);
  }
  .power-btn.active::before {
    border-color: rgba(255,215,0,0.3);
  }
  .power-status {
    margin-top: 10px;
    font-size: 11px;
    color: #00ff88;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .power-status.off { color: #666; }
  
  /* ============ COUNTDOWN ============ */
  .countdown-section {
    position: absolute;
    bottom: 30px;
    left: 20px;
    right: 20px;
    z-index: 20;
  }
  .countdown-card {
    background: rgba(10,10,15,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 15px;
    padding: 12px;
    text-align: center;
  }
  .countdown-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .countdown-time {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
  }
  
  /* ============ TOAST ============ */
  .toast {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(0,255,136,0.95);
    color: #000;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: bold;
    z-index: 1000;
    transition: transform 0.3s;
    box-shadow: 0 5px 30px rgba(0,255,136,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  
  /* ============ RESPONSIVE ============ */
  @media (max-width: 480px) {
    .phone-wrapper { padding: 0; background: #000; }
    .phone-frame {
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .notch { display: none; }
  }
</style>
</head>
<body>

<div class="phone-wrapper">
  <div class="phone-frame">
    <div class="notch"></div>
    
    <!-- Background Grid -->
    <div class="bg-grid"></div>
    
    <!-- Matrix Particles -->
    <div class="matrix-container" id="matrix-container"></div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="time">09:41</span>
      <div>
        <span>📶</span>
        <span>📡</span>
        <span>🔋</span>
      </div>
    </div>
    
    <!-- App Header -->
    <div class="app-header">
      <div class="logo-mobile">⚡ BOSSX</div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
      
      <!-- Balance Card -->
      <div class="balance-card">
        <div class="balance-label">Node Active</div>
        <div class="balance-amount" id="balance-amount">0.000</div>
        <div class="balance-stats">
          <div class="balance-stat">
            <span class="balance-stat-label">Rate</span>
            <span class="balance-stat-value" id="mining-rate">+0.015/s</span>
          </div>
          <div class="balance-stat">
            <span class="balance-stat-label">Today</span>
            <span class="balance-stat-value" id="today-earned">+0.000</span>
          </div>
          <div class="balance-stat">
            <span class="balance-stat-label">Est. USD</span>
            <span class="balance-stat-value">$0.00</span>
          </div>
        </div>
      </div>
      
      <!-- Cyber Node -->
      <div class="node-container">
        <div class="orbital-ring ring-1" id="ring-1"></div>
        <div class="orbital-ring ring-2" id="ring-2"></div>
        <div class="orbital-ring ring-3" id="ring-3"></div>
        
        <div class="core-node" id="core-node">
          <div class="core-symbol">⚡</div>
        </div>
        
        <!-- Data Streams -->
        <div class="data-stream" id="stream-1" style="left: 20%;"></div>
        <div class="data-stream" id="stream-2" style="left: 50%;"></div>
        <div class="data-stream" id="stream-3" style="left: 80%;"></div>
      </div>
      
      <!-- Power Button -->
      <div class="power-section">
        <button class="power-btn" id="power-btn" onclick="togglePower()">
          ON
        </button>
        <div class="power-status off" id="power-status">Node Offline</div>
      </div>
      
      <!-- Countdown -->
      <div class="countdown-section">
        <div class="countdown-card">
          <div class="countdown-label">⏰ Next Cycle</div>
          <div class="countdown-time" id="countdown">--:--:--</div>
        </div>
      </div>
      
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">✅ Node Activated</div>
    
  </div>
</div>

<script>
  // ============ TIME DISPLAY ============
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}`;
  }
  updateTime();
  setInterval(updateTime, 1000);
  
  // ============ COUNTDOWN ============
  function updateCountdown() {
    const now = new Date();
    const target = new Date();
    target.setHours(6, 0, 0, 0);
    if (now > target) target.setDate(target.getDate() + 1);
    
    const diff = target - now;
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    document.getElementById('countdown').textContent = 
      `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();
  
  // ============ MATRIX PARTICLES ============
  function createMatrixParticles() {
    const container = document.getElementById('matrix-container');
    const chars = '01';
    
    for (let i = 0; i < 30; i++) {
      const char = document.createElement('div');
      char.className = 'matrix-char';
      char.textContent = chars[Math.floor(Math.random() * chars.length)];
      char.style.left = Math.random() * 100 + '%';
      char.style.animationDuration = (Math.random() * 3 + 2) + 's';
      char.style.animationDelay = Math.random() * 5 + 's';
      container.appendChild(char);
    }
  }
  createMatrixParticles();
  
  // ============ MINING LOGIC ============
  let currentPoints = 0;
  let todayEarned = 0;
  let isPowerOn = false;
  let miningInterval = null;
  
  function updateBalance() {
    document.getElementById('balance-amount').textContent = 
      currentPoints.toFixed(3);
    document.getElementById('today-earned').textContent = 
      '+' + todayEarned.toFixed(3);
  }
  
  function togglePower() {
    const btn = document.getElementById('power-btn');
    const status = document.getElementById('power-status');
    const coreNode = document.getElementById('core-node');
    const ring1 = document.getElementById('ring-1');
    const ring2 = document.getElementById('ring-2');
    const ring3 = document.getElementById('ring-3');
    const stream1 = document.getElementById('stream-1');
    const stream2 = document.getElementById('stream-2');
    const stream3 = document.getElementById('stream-3');
    
    isPowerOn = !isPowerOn;
    
    if (isPowerOn) {
      btn.classList.add('active');
      btn.textContent = 'ACTIVE';
      status.textContent = 'Node Online';
      status.classList.remove('off');
      
      // Activate node
      coreNode.classList.add('active');
      ring1.classList.add('active');
      ring2.classList.add('active');
      ring3.classList.add('active');
      stream1.classList.add('active');
      stream2.classList.add('active');
      stream3.classList.add('active');
      
      // Start mining
      miningInterval = setInterval(() => {
        currentPoints += 0.015;
        todayEarned += 0.015;
        updateBalance();
      }, 1000);
      
      showToast('⚡ Node Activated');
    } else {
      btn.classList.remove('active');
      btn.textContent = 'ON';
      status.textContent = 'Node Offline';
      status.classList.add('off');
      
      // Deactivate node
      coreNode.classList.remove('active');
      ring1.classList.remove('active');
      ring2.classList.remove('active');
      ring3.classList.remove('active');
      stream1.classList.remove('active');
      stream2.classList.remove('active');
      stream3.classList.remove('active');
      
      // Stop mining
      if (miningInterval) {
        clearInterval(miningInterval);
        miningInterval = null;
      }
      
      showToast('⏸️ Node Deactivated');
    }
  }
  
  // ============ TOAST ============
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>

</body>
</html>
