<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>BossX Mining - Animasi Tambang</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f;
    color: #fff;
    overflow: hidden;
    height: 100%;
  }
  
  /* ============ PHONE FRAME ============ */
  .phone-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, #1a1a2e, #0a0a0f);
  }
  .phone-frame {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 900px;
    background: #0a0a0f;
    border-radius: 40px;
    border: 8px solid #1a1a2e;
    box-shadow: 0 0 60px rgba(255,215,0,0.2);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 25px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }
  
  /* ============ STATUS BAR ============ */
  .status-bar {
    padding: 8px 20px 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    background: #0a0a0f;
    flex-shrink: 0;
  }
  
  /* ============ APP HEADER ============ */
  .app-header {
    padding: 15px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0a0a0f;
    flex-shrink: 0;
  }
  .logo-mobile {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd700, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  /* ============ MINING AREA ============ */
  .mining-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at center bottom, #2a1a0a 0%, #0a0a0f 70%);
  }
  
  /* Background particles */
  .bg-particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .bg-particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,215,0,0.3);
    border-radius: 50%;
    animation: float 8s infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
  }
  
  /* Rock/Ground */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: linear-gradient(180deg, transparent 0%, #1a0f05 30%, #2a1a0a 100%);
  }
  .rock {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 120px;
  }
  
  /* Pickaxe */
  .pickaxe-container {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 150px;
    z-index: 10;
  }
  .pickaxe {
    width: 100%;
    height: 100%;
    transform-origin: 50% 90%;
    transition: transform 0.1s;
  }
  .pickaxe.swinging {
    animation: pickaxeSwing 0.8s ease-in-out infinite;
  }
  @keyframes pickaxeSwing {
    0%, 100% { transform: rotate(-30deg); }
    50% { transform: rotate(30deg); }
  }
  
  /* Impact effect */
  .impact {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    pointer-events: none;
    opacity: 0;
  }
  .impact.active {
    animation: impactFlash 0.3s ease-out;
  }
  @keyframes impactFlash {
    0% { opacity: 1; transform: translateX(-50%) scale(0.5); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.5); }
  }
  
  /* Particles */
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: radial-gradient(circle, #ffd700, #ff8c00);
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255,215,0,0.8);
  }
  .particle.animate {
    animation: particleFly 1s ease-out forwards;
  }
  @keyframes particleFly {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(0);
      opacity: 0;
    }
  }
  
  /* Coin popup */
  .coin-popup {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    color: #ffd700;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(255,215,0,0.8);
    animation: coinFloat 1.5s ease-out forwards;
  }
  @keyframes coinFloat {
    0% {
      transform: translateY(0) scale(0.5);
      opacity: 0;
    }
    20% {
      transform: translateY(-20px) scale(1.2);
      opacity: 1;
    }
    100% {
      transform: translateY(-100px) scale(1);
      opacity: 0;
    }
  }
  
  /* Spark effect */
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 8px #ffd700;
  }
  .spark.animate {
    animation: sparkFly 0.5s ease-out forwards;
  }
  @keyframes sparkFly {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--sx), var(--sy)) scale(0);
      opacity: 0;
    }
  }
  
  /* ============ BALANCE DISPLAY ============ */
  .balance-overlay {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    z-index: 20;
  }
  .balance-card {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 20px;
    padding: 15px;
    text-align: center;
  }
  .balance-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .balance-amount {
    font-size: 32px;
    font-weight: 900;
    color: #ffd700;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }
  .balance-rate {
    font-size: 13px;
    color: #00ff88;
    margin-top: 5px;
  }
  
  /* ============ POWER BUTTON ============ */
  .power-overlay {
    position: absolute;
    bottom: 220px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
  }
  .power-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #00ff88, #008855);
    border: none;
    color: #000;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(0,255,136,0.4);
    transition: all 0.3s;
    position: relative;
  }
  .power-btn::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,136,0.3);
    animation: ripple 2s infinite;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .power-btn.active {
    background: radial-gradient(circle at 30% 30%, #ffd700, #cc8800);
    box-shadow: 0 0 60px rgba(255,215,0,0.6);
  }
  .power-btn.active::before {
    border-color: rgba(255,215,0,0.4);
  }
  .power-status {
    margin-top: 10px;
    font-size: 12px;
    color: #00ff88;
    font-weight: 600;
  }
  .power-status.off { color: #888; }
  
  /* ============ COUNTDOWN ============ */
  .countdown-overlay {
    position: absolute;
    bottom: 150px;
    left: 20px;
    right: 20px;
    z-index: 20;
  }
  .countdown-card {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 15px;
    padding: 12px;
    text-align: center;
  }
  .countdown-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .countdown-time {
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    font-family: 'Courier New', monospace;
  }
  
  /* ============ TOAST ============ */
  .toast {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(0,255,136,0.95);
    color: #000;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: bold;
    z-index: 1000;
    transition: transform 0.3s;
    box-shadow: 0 5px 20px rgba(0,255,136,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  
  /* ============ RESPONSIVE ============ */
  @media (max-width: 480px) {
    .phone-wrapper { padding: 0; background: #0a0a0f; }
    .phone-frame {
      max-width: 100%;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .notch { display: none; }
  }
</style>
</head>
<body>

<div class="phone-wrapper">
  <div class="phone-frame">
    <div class="notch"></div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="time">09:41</span>
      <div>
        <span>📶</span>
        <span>📡</span>
        <span>🔋</span>
      </div>
    </div>
    
    <!-- App Header -->
    <div class="app-header">
      <div class="logo-mobile">⚡ BOSSX MINING</div>
    </div>
    
    <!-- Mining Area -->
    <div class="mining-area" id="mining-area">
      
      <!-- Background Particles -->
      <div class="bg-particles" id="bg-particles"></div>
      
      <!-- Balance Display -->
      <div class="balance-overlay">
        <div class="balance-card">
          <div class="balance-label">💰 Total Poin</div>
          <div class="balance-amount" id="balance-amount">0</div>
          <div class="balance-rate" id="balance-rate">+0/detik</div>
        </div>
      </div>
      
      <!-- Pickaxe -->
      <div class="pickaxe-container">
        <svg class="pickaxe" id="pickaxe" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Handle -->
          <rect x="47" y="40" width="6" height="50" fill="#8B4513" rx="2"/>
          <rect x="48" y="42" width="4" height="48" fill="#A0522D" rx="1"/>
          
          <!-- Head -->
          <path d="M 20 30 L 50 40 L 80 30 L 75 35 L 50 45 L 25 35 Z" 
                fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
          <path d="M 20 30 L 50 40 L 50 45 L 25 35 Z" fill="#A8A8A8"/>
          <path d="M 50 40 L 80 30 L 75 35 L 50 45 Z" fill="#D3D3D3"/>
          
          <!-- Shine -->
          <ellipse cx="35" cy="35" rx="8" ry="3" fill="rgba(255,255,255,0.4)"/>
          <ellipse cx="65" cy="35" rx="8" ry="3" fill="rgba(255,255,255,0.4)"/>
        </svg>
      </div>
      
      <!-- Impact Effect -->
      <div class="impact" id="impact">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="40" fill="rgba(255,215,0,0.3)"/>
          <circle cx="50" cy="50" r="25" fill="rgba(255,215,0,0.5)"/>
        </svg>
      </div>
      
      <!-- Ground & Rock -->
      <div class="ground"></div>
      <svg class="rock" viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M 30 80 L 50 40 L 90 30 L 130 40 L 150 80 L 140 100 L 40 100 Z" 
              fill="#3a2a1a" stroke="#2a1a0a" stroke-width="2"/>
        <path d="M 50 40 L 90 30 L 90 60 L 50 70 Z" fill="#4a3a2a"/>
        <path d="M 90 30 L 130 40 L 130 70 L 90 60 Z" fill="#2a1a0a"/>
        <!-- Gold veins -->
        <circle cx="70" cy="55" r="4" fill="#ffd700" opacity="0.6"/>
        <circle cx="110" cy="60" r="3" fill="#ffd700" opacity="0.6"/>
        <circle cx="90" cy="75" r="5" fill="#ffd700" opacity="0.6"/>
      </svg>
      
      <!-- Power Button -->
      <div class="power-overlay">
        <button class="power-btn" id="power-btn" onclick="togglePower()">
          ON<br>POWER
        </button>
        <div class="power-status off" id="power-status">Tekan untuk mulai menambang</div>
      </div>
      
      <!-- Countdown -->
      <div class="countdown-overlay">
        <div class="countdown-card">
          <div class="countdown-label">⏰ Siklus Berikutnya</div>
          <div class="countdown-time" id="countdown">--:--:--</div>
        </div>
      </div>
      
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">✅ Berhasil!</div>
    
  </div>
</div>

<script>
  // ============ TIME DISPLAY ============
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}`;
  }
  updateTime();
  setInterval(updateTime, 1000);
  
  // ============ COUNTDOWN ============
  function updateCountdown() {
    const now = new Date();
    const target = new Date();
    target.setHours(6, 0, 0, 0);
    if (now > target) target.setDate(target.getDate() + 1);
    
    const diff = target - now;
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    document.getElementById('countdown').textContent = 
      `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();
  
  // ============ BACKGROUND PARTICLES ============
  function createBgParticles() {
    const container = document.getElementById('bg-particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'bg-particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
      container.appendChild(particle);
    }
  }
  createBgParticles();
  
  // ============ MINING LOGIC ============
  let currentPoints = 0;
  let isPowerOn = false;
  let miningInterval = null;
  
  function updateBalance() {
    document.getElementById('balance-amount').textContent = 
      Math.floor(currentPoints).toLocaleString('id-ID');
  }
  
  function togglePower() {
    const btn = document.getElementById('power-btn');
    const status = document.getElementById('power-status');
    const pickaxe = document.getElementById('pickaxe');
    
    isPowerOn = !isPowerOn;
    
    if (isPowerOn) {
      btn.classList.add('active');
      btn.innerHTML = 'ACTIVE<br>⚡';
      status.textContent = '🟢 Menambang aktif!';
      status.classList.remove('off');
      pickaxe.classList.add('swinging');
      
      // Start mining
      miningInterval = setInterval(() => {
        mineAction();
      }, 800);
      
      showToast('⚡ Power ON! Menambang dimulai');
    } else {
      btn.classList.remove('active');
      btn.innerHTML = 'ON<br>POWER';
      status.textContent = 'Tekan untuk mulai menambang';
      status.classList.add('off');
      pickaxe.classList.remove('swinging');
      
      // Stop mining
      if (miningInterval) {
        clearInterval(miningInterval);
        miningInterval = null;
      }
      
      showToast('⏸️ Power OFF');
    }
  }
  
  function mineAction() {
    // Add points
    currentPoints += 15;
    updateBalance();
    
    // Create particles
    createParticles();
    
    // Create sparks
    createSparks();
    
    // Create coin popup
    createCoinPopup();
    
    // Impact effect
    const impact = document.getElementById('impact');
    impact.classList.remove('active');
    void impact.offsetWidth; // Trigger reflow
    impact.classList.add('active');
  }
  
  function createParticles() {
    const miningArea = document.getElementById('mining-area');
    const rect = miningArea.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height - 150;
    
    for (let i = 0; i < 8; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = centerX + 'px';
      particle.style.top = centerY + 'px';
      
      const angle = (Math.PI * 2 * i) / 8;
      const distance = 80 + Math.random() * 40;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 50;
      
      particle.style.setProperty('--tx', tx + 'px');
      particle.style.setProperty('--ty', ty + 'px');
      
      miningArea.appendChild(particle);
      
      setTimeout(() => {
        particle.classList.add('animate');
      }, 10);
      
      setTimeout(() => {
        particle.remove();
      }, 1000);
    }
  }
  
  function createSparks() {
    const miningArea = document.getElementById('mining-area');
    const rect = miningArea.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height - 150;
    
    for (let i = 0; i < 6; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = centerX + 'px';
      spark.style.top = centerY + 'px';
      
      const angle = (Math.PI * 2 * i) / 6;
      const distance = 50 + Math.random() * 30;
      const sx = Math.cos(angle) * distance;
      const sy = Math.sin(angle) * distance - 30;
      
      spark.style.setProperty('--sx', sx + 'px');
      spark.style.setProperty('--sy', sy + 'px');
      
      miningArea.appendChild(spark);
      
      setTimeout(() => {
        spark.classList.add('animate');
      }, 10);
      
      setTimeout(() => {
        spark.remove();
      }, 500);
    }
  }
  
  function createCoinPopup() {
    const miningArea = document.getElementById('mining-area');
    const rect = miningArea.getBoundingClientRect();
    const centerX = rect.width / 2;
    const centerY = rect.height - 200;
    
    const popup = document.createElement('div');
    popup.className = 'coin-popup';
    popup.textContent = '+15';
    popup.style.left = (centerX - 20 + Math.random() * 40) + 'px';
    popup.style.top = centerY + 'px';
    
    miningArea.appendChild(popup);
    
    setTimeout(() => {
      popup.remove();
    }, 1500);
  }
  
  // ============ TOAST ============
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>

</body>
</html>
